    <g transform="translate(360 138)"><rect x="-70" y="-62" width="140" height="124" rx="18" fill="#fff" stroke="#64752d" stroke-width="3"/><path d="M-42-25h84M-42 0h65M-42 25h48" stroke="#c4d27c" stroke-width="9" stroke-linecap="round"/><text y="91" font-size="17" font-weight="700">Lifestyle quiz</text><text y="114" font-size="13" fill="#586170">Goals &amp; preferences</text></g>
