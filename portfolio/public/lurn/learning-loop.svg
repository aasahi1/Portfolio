<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">LURN student learning loop</title>
  <desc id="desc">A student joins a class, receives a personalized activity, practices in short steps, gets feedback, and sees progress and a next step.</desc>
  <rect width="1000" height="280" rx="28" fill="#fff8ed"/>
  <path d="M185 137h70m150 0h70m150 0h70m150 0h70" stroke="#6c5791" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 9"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#28223a">
    <g transform="translate(105 137)"><circle r="54" fill="#fff" stroke="#6c5791" stroke-width="3"/><path d="M-22-14h44v34h-44zM-13-25h26" fill="none" stroke="#c6acd9" stroke-width="7" stroke-linecap="round"/><text y="80" font-size="16" font-weight="700">Join class</text><text y="102" font-size="12" fill="#686174">Get oriented</text></g>
    <g transform="translate(300 137)"><circle r="54" fill="#fff" stroke="#6c5791" stroke-width="3"/><path d="M-25-18h50v37h-50zM-15-7h30M-15 5h20" fill="none" stroke="#c6acd9" stroke-width="6" stroke-linecap="round"/><text y="80" font-size="16" font-weight="700">Personalize</text><text y="102" font-size="12" fill="#686174">Choose preferences</text></g>
    <g transform="translate(500 137)"><circle r="54" fill="#fff" stroke="#6c5791" stroke-width="3"/><path d="M-20-23h40v47h-40zM-10-9h20M-10 2h20M-10 13h12" fill="none" stroke="#c6acd9" stroke-width="6" stroke-linecap="round"/><text y="80" font-size="16" font-weight="700">Practice</text><text y="102" font-size="12" fill="#686174">Short activities</text></g>
    <g transform="translate(700 137)"><circle r="54" fill="#fff" stroke="#6c5791" stroke-width="3"/><path d="M-25-10h50M-17 4l11 11 23-27" fill="none" stroke="#c6acd9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text y="80" font-size="16" font-weight="700">Get feedback</text><text y="102" font-size="12" fill="#686174">Teacher in the loop</text></g>
    <g transform="translate(895 137)"><circle r="54" fill="#fff" stroke="#6c5791" stroke-width="3"/><path d="M-25 20v-25l17 10 15-27 18 8" fill="none" stroke="#c6acd9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text y="80" font-size="16" font-weight="700">See progress</text><text y="102" font-size="12" fill="#686174">Choose next step</text></g>
  </g>
</svg>
