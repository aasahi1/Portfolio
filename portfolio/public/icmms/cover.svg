    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24d4ff"/><stop offset="1" stop-color="#356dff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1200" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="220" fill="#1f65ff" opacity=".2" filter="url(#blur)"/>
  <circle cx="170" cy="770" r="190" fill="#13cfee" opacity=".15" filter="url(#blur)"/>
  <g opacity=".12" stroke="#8db5df"><path d="M0 180h1200M0 360h1200M0 540h1200M0 720h1200"/><path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900"/></g>
