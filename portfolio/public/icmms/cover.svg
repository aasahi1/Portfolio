<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ICMMS confidential case study cover</title>
  <desc id="desc">Abstract blue interface-inspired artwork with no product data or screens.</desc>
  <defs>
