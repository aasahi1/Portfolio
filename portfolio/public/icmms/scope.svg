<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ICMMS portfolio-safe project scope</title>
  <desc id="desc">Abstract cards list shareable design disciplines without revealing the protected product.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#12345c"/></linearGradient></defs>
  <rect width="1200" height="900" rx="56" fill="url(#g)"/>
  <circle cx="1050" cy="90" r="270" fill="#245dff" opacity=".18"/>
  <text x="100" y="134" fill="#24d4ff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="4">WHAT I CAN SHARE</text>
  <text x="100" y="210" fill="white" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="900">The craft, without the confidentials.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(100 330)"><rect width="300" height="260" rx="30" fill="#0b2238" stroke="#285783"/><circle cx="48" cy="50" r="13" fill="#24d4ff"/><text x="32" y="116" fill="white" font-size="30" font-weight="800">Product strategy</text><text x="32" y="164" fill="#8bb1d3" font-size="19"><tspan x="32">Problem framing and</tspan><tspan x="32" dy="30">decision principles</tspan></text></g>
    <g transform="translate(450 330)"><rect width="300" height="260" rx="30" fill="#0b2238" stroke="#285783"/><circle cx="48" cy="50" r="13" fill="#4c7cff"/><text x="32" y="116" fill="white" font-size="30" font-weight="800">System thinking</text><text x="32" y="164" fill="#8bb1d3" font-size="19"><tspan x="32">Information hierarchy</tspan><tspan x="32" dy="30">and scalable patterns</tspan></text></g>
    <g transform="translate(800 330)"><rect width="300" height="260" rx="30" fill="#0b2238" stroke="#285783"/><circle cx="48" cy="50" r="13" fill="#8faeff"/><text x="32" y="116" fill="white" font-size="30" font-weight="800">Content + UI</text><text x="32" y="164" fill="#8bb1d3" font-size="19"><tspan x="32">A unified voice and</tspan><tspan x="32" dy="30">visual experience</tspan></text></g>
  </g>
  <rect x="100" y="695" width="1000" height="86" rx="24" fill="#081a2d" stroke="#285783"/>
  <text x="145" y="750" fill="#a8c7e4" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Specific screens, workflows, customer data, and business metrics are intentionally omitted.</text>
</svg>
