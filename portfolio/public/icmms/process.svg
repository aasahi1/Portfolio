<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ICMMS design process overview</title>
  <desc id="desc">A generalized four-step design process without confidential product details.</desc>
  <rect width="1200" height="900" rx="56" fill="#071421"/>
  <text x="90" y="120" fill="#24d4ff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="4">END-TO-END OWNERSHIP</text>
  <text x="90" y="194" fill="white" font-family="Inter,Arial,sans-serif" font-size="60" font-weight="900">From ambiguity to a coherent system.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(90 305)"><rect width="240" height="350" rx="28" fill="#0d2740" stroke="#1e4d76"/><text x="28" y="62" fill="#24d4ff" font-size="19" font-weight="800">01</text><text x="28" y="126" fill="white" font-size="31" font-weight="800">Discover</text><text x="28" y="175" fill="#89afd1" font-size="20"><tspan x="28" dy="0">Understand people,</tspan><tspan x="28" dy="32">constraints, and</tspan><tspan x="28" dy="32">shared language.</tspan></text></g>
    <g transform="translate(350 305)"><rect width="240" height="350" rx="28" fill="#0d2740" stroke="#1e4d76"/><text x="28" y="62" fill="#24d4ff" font-size="19" font-weight="800">02</text><text x="28" y="126" fill="white" font-size="31" font-weight="800">Structure</text><text x="28" y="175" fill="#89afd1" font-size="20"><tspan x="28" dy="0">Turn complexity into</tspan><tspan x="28" dy="32">clear hierarchy and</tspan><tspan x="28" dy="32">usable flows.</tspan></text></g>
    <g transform="translate(610 305)"><rect width="240" height="350" rx="28" fill="#0d2740" stroke="#1e4d76"/><text x="28" y="62" fill="#24d4ff" font-size="19" font-weight="800">03</text><text x="28" y="126" fill="white" font-size="31" font-weight="800">Prototype</text><text x="28" y="175" fill="#89afd1" font-size="20"><tspan x="28" dy="0">Make decisions</tspan><tspan x="28" dy="32">tangible, testable,</tspan><tspan x="28" dy="32">and aligned.</tspan></text></g>
    <g transform="translate(870 305)"><rect width="240" height="350" rx="28" fill="#0d2740" stroke="#1e4d76"/><text x="28" y="62" fill="#24d4ff" font-size="19" font-weight="800">04</text><text x="28" y="126" fill="white" font-size="31" font-weight="800">Deliver</text><text x="28" y="175" fill="#89afd1" font-size="20"><tspan x="28" dy="0">Carry the system</tspan><tspan x="28" dy="32">through content, UI,</tspan><tspan x="28" dy="32">and handoff.</tspan></text></g>
  </g>
  <text x="90" y="770" fill="#557ca3" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">PROCESS SHOWN · PRODUCT DETAILS WITHHELD</text>
</svg>
